version: '3.8'

services:
  gatus:
    image: twinproduction/gatus:latest
    container_name: gatus
    volumes:
      - ./config.yaml:/config/config.yaml
    restart: unless-stopped

  caddy:
    image: caddy:latest
    container_name: caddy
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config: