- name: Install prerequisite packages for Docker repository
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: yes

- name: Ensure /etc/apt/keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Docker official GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Add Docker official repository for Debian
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/debian
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    signed_by: https://download.docker.com/linux/debian/gpg
    state: present

- name: Install Docker and Docker Compose plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
    state: present
    update_cache: yes
    
- name: Ensure Docker service is started and enabled
  ansible.builtin.service:
    name: docker
    state: started
    enabled: yes

- name: Create app directory
  ansible.builtin.file:
    path: /opt/minecraft-stack
    state: directory
    mode: '0755'

- name: Copy Game Host compose and config files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/opt/minecraft-stack/{{ item | basename }}"
    mode: '0644'
  loop:
    - ../../../../docker/game-host/docker-compose.yml
    - ../../../../docker/game-host/prometheus.yml

- name: Deploy Docker Compose stack
  community.docker.docker_compose_v2:
    project_src: /opt/minecraft-stack
    state: present