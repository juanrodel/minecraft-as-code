- name: Install Docker and Docker Compose plugin
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
    state: present
    update_cache: yes

- name: Ensure Docker service is started and enabled
  ansible.builtin.service:
    name: docker
    state: started
    enabled: yes

- name: Create status stack directory
  ansible.builtin.file:
    path: /opt/status-stack
    state: directory
    mode: '0755'

- name: Copy Status VM compose and config files
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/opt/status-stack/{{ item | basename }}"
    mode: '0644'
  loop:
    - ../../../../docker/status-vm/docker-compose.yml
    - ../../../../docker/status-vm/config.yaml
    - ../../../../docker/status-vm/Caddyfile

- name: Deploy Status Compose stack
  community.docker.docker_compose_v2:
    project_src: /opt/status-stack
    state: present